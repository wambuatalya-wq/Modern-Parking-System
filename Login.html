{% extends "base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}

    <lable>Password <input type="password" name="password" required></lable>

  <p class="hint">accounts - admin / admin123 &nbsp; &nbsp; attendant / attendant123</p>
  {% endblock %}
